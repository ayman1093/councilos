[package]
name = "councilos-kernel"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Governed, replayable execution kernel for AI agents. M0: silent skeleton (data contracts + hashing rules only)."
repository = "https://github.com/ayman1093/councilos"
publish = false

[lib]
name = "councilos_kernel"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
proptest = "=1.6.0"

[[bin]]
name = "m1_nop_child"
path = "src/bin/m1_nop_child.rs"
test = false

[[bin]]
name = "m1_abort_child"
path = "src/bin/m1_abort_child.rs"
test = false

[[bin]]
name = "m1_bad_frame_child"
path = "src/bin/m1_bad_frame_child.rs"
test = false

[[bin]]
name = "m1_replay_child"
path = "src/bin/m1_replay_child.rs"
test = false
[profile.release]
codegen-units = 1
lto = "thin"
